<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bazar da Val — Painel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============ TELA DE LOGIN ============ -->
  <section id="tela-login" class="tela">
    <div class="caixa">
      <img src="logo-bazar-val.png" alt="Bazar da Val" class="logo-login" />
      <h1>Bazar da Val</h1>
      <p id="msg-login" class="msg"></p>
      <form id="form-login">
        <input type="email" id="login-email" placeholder="E-mail" required autocomplete="username" />
        <input type="password" id="login-senha" placeholder="Senha" required autocomplete="current-password" />
        <button type="submit" class="btn">Entrar</button>
      </form>
    </div>
  </section>

  <!-- ============ APP (visível após login) ============ -->
  <section id="tela-app" class="tela oculta">
    <header>
      <h1><img src="logo-bazar-val.png" alt="" class="logo-admin" />Bazar da Val</h1>
      <div class="acoes-topo">
        <a href="catalogo.html" class="link-catalogo" target="_blank">📖 Catálogo</a>
        <button id="btn-sair" class="btn btn-perigo">Sair</button>
      </div>
    </header>

    <nav id="abas">
      <button class="aba ativa" data-aba="estoque">Estoque</button>
      <button class="aba" data-aba="vendas">Vendas</button>
      <button class="aba" data-aba="clientes">Clientes</button>
      <button class="aba" data-aba="lucro">Lucro</button>
    </nav>

    <!-- ============ ESTOQUE ============ -->
    <main id="aba-estoque" class="conteudo">
      <h2>Estoque</h2>
      <form id="form-produto" class="form-produto">
        <div class="linha-campos">
          <input type="text" id="p-nome" placeholder="Produto (ex.: Camisa social)" required />
          <input type="number" id="p-qtd" placeholder="Qtd" min="0" required />
          <input type="number" id="p-preco" placeholder="Preço venda (R$)" min="0" step="0.01" required />
          <input type="number" id="p-custo" placeholder="Custo unit. (R$)" min="0" step="0.01" />
        </div>
        <div class="linha-campos">
          <select id="p-categoria">
            <option value="">Categoria…</option>
            <option>Roupas</option>
            <option>Calçados</option>
            <option>Acessórios</option>
            <option>Infantil</option>
            <option>Pets</option>
            <option>Utilidades para Casa</option>
          </select>
          <select id="p-genero">
            <option value="">Gênero…</option>
            <option>Masculino</option>
            <option>Feminino</option>
            <option>Infantil</option>
            <option>Unissex</option>
          </select>
          <input type="text" id="p-cor" placeholder="Cor (ex.: azul marinho)" />
        </div>
        <div id="campo-tamanhos" class="oculta">
          <input type="text" id="p-tam" placeholder="Tamanhos (ex.: P, M, G)" />
        </div>
        <div id="campo-numeros" class="oculta">
          <p class="rotulo">Números disponíveis (calçados)</p>
          <div id="chips-numeros" class="chips-numeros"></div>
        </div>
        <textarea id="p-desc" rows="3" placeholder="Descrição do produto (opcional — aparece na página do produto)"></textarea>
        <div class="linha-fotos">
          <div id="foto-preview" class="foto-preview"></div>
          <input type="file" id="p-fotos" accept="image/*" multiple />
          <p class="dica-campo">Até 4 fotos por produto (2 MB cada). O “Custo unit.” é usado no gráfico de lucro.</p>
        </div>
        <div class="linha-botoes">
          <button type="submit" class="btn" id="btn-salvar-produto">Adicionar</button>
          <button type="button" class="btn btn-perigo oculta" id="btn-cancelar-edicao">Cancelar edição</button>
        </div>
      </form>
      <ul id="lista-produtos" class="lista"></ul>
    </main>

    <!-- ============ VENDAS ============ -->
    <main id="aba-vendas" class="conteudo oculta">
      <h2>Registrar venda</h2>
      <form id="form-venda">
        <div class="linha-campos">
          <select id="v-produto" required><option value="">Produto…</option></select>
          <input type="number" id="v-qtd" placeholder="Qtd" min="1" value="1" required />
          <button type="button" class="btn btn-mini" id="btn-adicionar-item">+ Adicionar</button>
        </div>
        <ul id="venda-itens" class="lista"></ul>
        <p id="venda-total" class="venda-total"></p>

        <div class="linha-campos">
          <select id="v-cliente"><option value="">Comprador: avulso (sem cliente)</option></select>
          <input type="text" id="v-nome" placeholder="Nome do comprador" />
          <input type="tel" id="v-tel" placeholder="WhatsApp do comprador" />
        </div>
        <div class="linha-campos">
          <select id="v-pagamento">
            <option value="">Forma de pagamento…</option>
            <option>Pix</option>
            <option>Dinheiro</option>
            <option>Cartão</option>
            <option>Transferência</option>
            <option>Outro</option>
          </select>
          <input type="number" id="v-troco" placeholder="Troco (R$) — se dinheiro" min="0" step="0.01" />
        </div>
        <input type="text" id="v-desc" placeholder="Descrição da venda (opcional — ex.: combo, pronta-entrega…)" />
        <p id="msg-venda" class="msg"></p>
        <button type="submit" class="btn">Registrar venda</button>
      </form>
      <h3>Vendas recentes</h3>
      <ul id="lista-vendas" class="lista"></ul>
    </main>

    <!-- ============ CLIENTES ============ -->
    <main id="aba-clientes" class="conteudo oculta">
      <h2>Clientes</h2>
      <form id="form-cliente" class="form-produto">
        <div class="linha-campos">
          <input type="text" id="c-nome" placeholder="Nome" required />
          <input type="tel" id="c-telefone" placeholder="WhatsApp (ex.: 31 99999-9999)" required />
        </div>
        <input type="text" id="c-endereco" placeholder="Endereço (ex.: Rua X, 123 — Nova Pampulha)" />
        <div class="linha-botoes">
          <button type="submit" class="btn" id="btn-salvar-cliente">Adicionar</button>
          <button type="button" class="btn btn-perigo oculta" id="btn-cancelar-cliente">Cancelar edição</button>
        </div>
      </form>
      <ul id="lista-clientes" class="lista"></ul>
    </main>

    <!-- ============ LUCRO ============ -->
    <main id="aba-lucro" class="conteudo oculta">
      <h2>Lucro</h2>
      <div class="linha-campos">
        <select id="lucro-periodo">
          <option value="hoje">Hoje</option>
          <option value="7d">Últimos 7 dias</option>
          <option value="mes" selected>Mês atual</option>
          <option value="tudo">Tudo</option>
        </select>
      </div>
      <div id="lucro-cards" class="lucro-cards"></div>
      <h3>Lucro por produto</h3>
      <div id="lucro-grafico" class="lucro-grafico"></div>
    </main>
  </section>

  <!-- Supabase (biblioteca oficial, via CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
