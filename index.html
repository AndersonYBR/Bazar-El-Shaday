<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bazar El Shaday</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============ TELA DE LOGIN ============ -->
  <section id="tela-login" class="tela">
    <div class="caixa">
      <h1>🛍️ Bazar El Shaday</h1>
      <p id="msg-login" class="msg"></p>
      <form id="form-login">
        <input type="email" id="login-email" placeholder="E-mail" required autocomplete="username" />
        <input type="password" id="login-senha" placeholder="Senha" required autocomplete="current-password" />
        <button type="submit" class="btn">Entrar</button>
      </form>
    </div>
  </section>

  <!-- ============ APP (visível após login) ============ -->
  <section id="tela-app" class="tela oculta">
    <header>
      <h1>🛍️ Bazar El Shaday</h1>
      <div class="acoes-topo">
        <a href="catalogo.html" class="link-catalogo" target="_blank">📖 Catálogo</a>
        <button id="btn-sair" class="btn btn-perigo">Sair</button>
      </div>
    </header>

    <nav id="abas">
      <button class="aba ativa" data-aba="estoque">Estoque</button>
      <button class="aba" data-aba="vendas">Vendas</button>
      <button class="aba" data-aba="clientes">Clientes</button>
    </nav>

    <!-- ESTOQUE -->
    <main id="aba-estoque" class="conteudo">
      <h2>Estoque</h2>
      <form id="form-produto" class="form-linha">
        <input type="text" id="p-nome" placeholder="Produto (ex.: Calça jeans)" required />
        <input type="number" id="p-qtd" placeholder="Qtd" min="0" required />
        <input type="number" id="p-preco" placeholder="Preço (R$)" min="0" step="0.01" required />
        <input type="text" id="p-tam" placeholder="Tamanhos (ex.: P, M, G)" />
        <input type="file" id="p-foto" accept="image/*" />
        <button type="submit" class="btn">Adicionar</button>
      </form>
      <p class="dica-campo">Foto opcional (até 2 MB). Tamanhos opcional — aparece no catálogo.</p>
      <ul id="lista-produtos" class="lista"></ul>
    </main>

    <!-- VENDAS -->
    <main id="aba-vendas" class="conteudo oculta">
      <h2>Registrar venda</h2>
      <form id="form-venda" class="form-linha">
        <select id="v-produto" required><option value="">Escolha o produto…</option></select>
        <input type="number" id="v-qtd" placeholder="Qtd" min="1" value="1" required />
        <button type="submit" class="btn">Vender</button>
      </form>
      <p id="msg-venda" class="msg"></p>
      <h3>Vendas de hoje</h3>
      <ul id="lista-vendas" class="lista"></ul>
    </main>

    <!-- CLIENTES -->
    <main id="aba-clientes" class="conteudo oculta">
      <h2>Clientes</h2>
      <form id="form-cliente" class="form-linha">
        <input type="text" id="c-nome" placeholder="Nome" required />
        <input type="tel" id="c-telefone" placeholder="WhatsApp (ex.: 31 99999-9999)" required />
        <button type="submit" class="btn">Adicionar</button>
      </form>
      <ul id="lista-clientes" class="lista"></ul>
    </main>
  </section>

  <!-- Supabase (biblioteca oficial, via CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>

</html>
