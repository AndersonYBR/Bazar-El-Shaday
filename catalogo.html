<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo — Bazar El Shaday</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>" />
  <link rel="stylesheet" href="catalogo.css" />
</head>
<body>

  <header class="topo">
    <h1>🛍️ Bazar El Shaday</h1>
    <p class="sub">Nova Pampulha · Vespasiano/MG</p>
    <a href="index.html" class="voltar">← Área da loja</a>
  </header>

  <!-- ============ CARROSSEL DE BANNERS ============ -->
  <section id="banner-wrap" class="banner-wrap" aria-label="Promoções">
    <div class="banner-slides">
      <img class="banner-slide ativa" src="banner1bazardaval.jpg" alt="Cantinho Pet — ração e petiscos" />
      <img class="banner-slide" src="banner2bazardaval.jpg" alt="Utilidades para o lar — ver ofertas" loading="lazy" />
      <img class="banner-slide" src="banner3bazardaval.jpg" alt="Coleção de verão — confira já" loading="lazy" />
      <img class="banner-slide" src="banner4bazardaval.jpg" alt="Feliz Dia das Crianças — confira agora" loading="lazy" />
      <img class="banner-slide" src="banner5bazardaval.jpg" alt="Grande promoção — até 60% de desconto" loading="lazy" />
    </div>
    <button type="button" id="banner-ant" class="banner-flecha" aria-label="Banner anterior">‹</button>
    <button type="button" id="banner-prox" class="banner-flecha" aria-label="Próximo banner">›</button>
    <div class="banner-dots">
      <span class="banner-dot ativa" data-b="0"></span>
      <span class="banner-dot" data-b="1"></span>
      <span class="banner-dot" data-b="2"></span>
      <span class="banner-dot" data-b="3"></span>
      <span class="banner-dot" data-b="4"></span>
    </div>
  </section>

  <main>
    <!-- O catalogo.js procura EXATAMENTE estes dois elementos -->
    <p id="msg-catalogo" class="msg"></p>
    <button id="btn-atualizar" class="btn-atualizar" type="button">↻ Atualizar</button>

    <div class="toolbar">
      <label for="ordenar-catalogo">Ordenar:</label>
      <select id="ordenar-catalogo">
        <option value="recentes">Mais recentes</option>
        <option value="preco-asc">Menor preço</option>
        <option value="preco-desc">Maior preço</option>
        <option value="nome">Nome (A–Z)</option>
      </select>
    </div>
    <div id="chips-categoria" class="chips-categoria"></div>

    <div id="lista-catalogo" class="grade"></div>
  </main>

  <footer>
    <p>📍 Nova Pampulha, Vespasiano/MG</p>
    <p>Fale conosco pelo WhatsApp de qualquer produto 😉</p>
  </footer>

  <!-- Biblioteca do Supabase (CDN) — obrigatório carregar ANTES do catalogo.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="catalogo.js"></script>
</body>
</html>
